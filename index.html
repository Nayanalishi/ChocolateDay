<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Chocolate Day 🍫</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #2b1b17, #4a2c23);
            font-family: 'Montserrat', sans-serif;
        }

        .card {
            background-color: #3a231d;
            border-radius: 22px;
            padding: 24px;
            width: 92%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        }

        img {
            width: 100%;
            height: auto;
            max-height: 260px;
            object-fit: cover;
            display: block;
            border-radius: 16px;
            margin-bottom: 20px;
            background-color: #000;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            color: #f5d6c6;
            margin-bottom: 14px;
        }

        .quote {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-style: italic;
            color: #ffffff;
            line-height: 1.65;
            margin-bottom: 18px;
        }

        .footer {
            font-size: 14px;
            color: #e0b9a8;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- IMAGE LINKED USING EXACT FILE NAME -->
        <img src="chocolateday.png" alt="Chocolate Day Image">

        <div class="title">Happy Chocolate Day 🍫</div>

        <div class="quote">
            “Just like dark chocolate, our love is both bitter and sweet.
            Even through the bitterness, we choose it—because the sweetness always finds a way to balance our hearts.”
        </div>

        <div class="footer">
            Forever & Always ❤️
        </div>

    </div>

</body>
</html>
